name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs the CPU-only path: no model weights, no network fetches.
  MLVOICE_ENV: development
  MLVOICE_TTS_BACKEND: dummy
  MLVOICE_LOG_LEVEL: WARNING

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Package metadata is generatable
        # A broken pyproject fails at install time, which a green test suite on
        # an already-installed package cannot catch. Building the wheel
        # validates every extra, including ones not installed here.
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/dist
          python -c "from importlib.metadata import metadata; print(metadata('mlvoice')['Version'])"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: mypy --strict
        run: mypy

      - name: Tests
        run: pytest -m "not slow" --cov --cov-report=xml --cov-report=term-missing

      - name: Malayalam frontend evaluation
        # The text frontend is the component that decides pronunciation
        # quality, so its test set is a build gate, not a report.
        run: mlvoice eval frontend --fail-under 1.0

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: mlvoice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm mlvoice:ci mlvoice version
          docker run --rm -e MLVOICE_TTS_BACKEND=dummy mlvoice:ci \
            mlvoice eval frontend --fail-under 1.0
